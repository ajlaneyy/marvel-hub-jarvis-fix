let W=ld("mt-w","{}"),R=ld("mt-r","{}"),tab="home",uni="M",ord="rel",flt="all",q="",grp="date",H=[],sample=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=x=>/^\d{4}-\d{2}-\d{2}$/.test(x.d)?new Date(x.d+"T00:00:00"):null;
const days=x=>{const d=dt(x);return d?Math.ceil((d-new Date().setHours(0,0,0,0))/864e5):null};
const out=x=>x.tbd?false:(days(x)===null?+x.d.slice(0,4)<=new Date().getFullYear():days(x)<=0);
const label=x=>x.tbd||(dt(x)?dt(x).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):x.d);

const $=s=>document.querySelector(s);

 a.sort((x,y)=>uni==="M"&&ord==="story"?x.s-y.s:0);$("#ls").innerHTML=a.map(row).join("")||'<p class="sub">Nothing here.</p>'}
function view(){nav();let h="";
 if(tab==="home"){const n=D.filter(x=>W[x.id]).length,t=D.length,x=next();
  h=`<h1>MY MARVEL</h1><div class="sub">Your watch progress</div><div class="card"><span class="big">${n}</span> <span class="sub">of ${t} watched</span><div class="bar"><i style="width:${n/t*100}%"></i></div></div>`;
  if(x)h+=`<h2>Watch this next</h2><div class="hero" style="--c:${U[x.u].c}">${po(x)}<div class="in"><div class="t" style="font-size:19px">${esc(x.n)}</div><div class="m">${esc(x.d.slice(0,4))}${x.r?" · "+esc(x.r):""}<br>On ${esc(U[x.u].w)}</div><button class="btn" data-ck="${x.id}">I watched it ✓</button><button class="btn g" data-ask="Why is ${esc(x.n)} next for me?">Why this?</button></div></div>`;
  h+=`<h2>By universe</h2><div class="card">`+Object.keys(U).map(u=>{const a=D.filter(x=>x.u===u),d=a.filter(x=>W[x.id]).length;return`<div class="m" style="margin-top:8px">${U[u].n} · ${d}/${a.length}</div><div class="bar"><i style="width:${d/a.length*100}%;background:${U[u].c}"></i></div>`}).join("")+`</div>`}
 else if(tab==="lib"){h=`<h1>LIBRARY</h1><div class="chips">${Object.keys(U).map(u=>`<button class="chip ${uni===u?"on":""}" data-uni="${u}">${U[u].n}</button>`).join("")}</div>`;
  if(uni==="M")h+=`<div class="chips"><button class="chip ${ord==="rel"?"on":""}" data-ord="rel">Release order</button><button class="chip ${ord==="story"?"on":""}" data-ord="story">Story order</button></div>`;
  h+=`<div class="chips">${[["all","All"],["u","Not watched"],["w","Watched"]].map(f=>`<button class="chip ${flt===f[0]?"on":""}" data-flt="${f[0]}">${f[1]}</button>`).join("")}</div><input id="q" placeholder="Search…" value="${esc(q)}"><div id="ls"></div>`}

  const cd=x=>{const d=days(x);return`<div class="row" style="--c:${U[x.u].c}">${po(x)}<div class="in"><div class="t">${esc(x.n)}</div><div class="m">${esc(label(x))} · ${esc(U[x.u].w)}</div>${d!==null?`<div class="days">in ${d} day${d===1?"":"s"}</div>`:""}</div></div>`};
  if(grp==="date")h+=a.sort((x,y)=>(days(x)??9e5)-(days(y)??9e5)).map(cd).join("");
  else for(const c in CL){const b=a.filter(x=>x.c===c);if(b.length)h+=`<h2>${CL[c]}</h2>`+b.map(cd).join("")}
  if(!a.length)h+='<p class="sub">Nothing upcoming right now.</p>'}
 else{h=`<h1>JARVIS</h1><div class="sub">Ask me anything about Marvel. I’ll ask before any spoilers.</div><div>${["What should I watch next?","What’s coming soon?","Any fan theories?"].map(t=>`<button class="btn g" data-ask="${t}">${t}</button>`).join("")}</div>`+H.map(m=>`<div class="msg ${m.r}">${esc(m.c)}</div>`).join("")+`<input id="ai" placeholder="Type your question…" enterkeyhint="send">`}
 $("#app").innerHTML=h;if(tab==="lib")libList()}
async function ai(p,after){
 try{
  const ctx=D.map(x=>x.n+" ["+U[x.u].n+","+x.d+","+(W[x.id]?"watched"+(R[x.id]?" "+R[x.id]+"/5":""):"not watched")+"]").join("; ");
  const response=await fetch("/.netlify/functions/jarvis",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({question:p,context:ctx})
  });
  let data={};try{data=await response.json()}catch(e){}
  if(!response.ok) throw new Error(data.error||("Server error ("+response.status+")"));
  after(data.answer||"Jarvis received an empty reply. Please try again.");
 }catch(e){after("Jarvis connection failed: "+(e&&e.message?e.message:"Unknown error")+". Check the Netlify function and ANTHROPIC_API_KEY setting.")}
}
function ask(t){if(!t)return;tab="ai";H.push({r:"u",c:t},{r:"a",c:"Thinking…"});view();ai(t,s=>{H[H.length-1].c=s;if(tab==="ai")view()})}

 if(b=g("data-tab")){tab=b.dataset.tab;view();scrollTo(0,0)}
 else if(b=g("data-uni")){uni=b.dataset.uni;view()}else if(b=g("data-ord")){ord=b.dataset.ord;view()}
 else if(b=g("data-flt")){flt=b.dataset.flt;view()}else if(b=g("data-grp")){grp=b.dataset.grp;view()}
 else if(b=g("data-ask"))ask(b.dataset.ask);
 else if(b=g("data-s")){const id=b.dataset.id,n=+b.dataset.s;if(R[id]===n)delete R[id];else{R[id]=n;W[id]=1}save();tab==="lib"?libList():view()}
 else if(b=g("data-ck")){const id=b.dataset.ck;if(W[id]){delete W[id];delete R[id]}else W[id]=1;save();tab==="lib"?libList():view()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;libList()}});
document.addEventListener("keydown",e=>{if(e.target.id==="ai"&&e.key==="Enter"){const t=e.target.value.trim();ask(t)}});
view();
